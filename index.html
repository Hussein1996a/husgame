<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hussein Game</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }

    .container {
        padding: 40px;
    }

    h1 {
        font-size: 48px;
        margin-bottom: 10px;
        letter-spacing: 2px;
    }

    p {
        color: #94a3b8;
        margin-bottom: 30px;
        font-size: 18px;
    }

    .btn {
        padding: 15px 40px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: linear-gradient(90deg, #22c55e, #16a34a);
        color: white;
        font-weight: bold;
        box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        transition: 0.3s;
        text-decoration: none;
        display: inline-block;
    }

    .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 30px rgba(34, 197, 94, 0.4);
    }
</style>

</head>

<body>

<div class="container">
    <h1>Hussein</h1>
    <p>Welcome to the official game portal</p>

    <!-- نفس التبويب بدون target="_blank" -->
    <a class="btn" href="https://bc.stox2.net/">
        دخول اللعبة
    </a>
</div>

</body>
</html>
